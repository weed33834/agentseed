name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s server -p "test_*.py"
      - name: Conformance gate (must be self-conformant to ship)
        run: python server/guard_cli.py check . --ci
      - name: Package plugin directory
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          zip -r "dist/AgentSeed-${version}.zip" . \
            -x ".git/*" ".github/*" "dist/*"
          tar --exclude=".git" --exclude=".github" --exclude="dist" \
            -czf "dist/AgentSeed-${version}.tar.gz" .
          ls -la dist
      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
