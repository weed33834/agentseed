[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentseed"
version = "1.1.0"
description = "AgentSeed — the governance layer for AI agents. Non-negotiable kernel + pluggable scenario packs + 15-platform sync."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["PyYAML"]
authors = [{ name = "badhope" }]
keywords = [
    "ai-agent", "agent-framework", "governance", "guardrails",
    "scenario-packs", "mcp", "model-context-protocol", "ai-rules",
    "system-prompt", "prompt-engineering", "claude-code", "cursor",
    "copilot", "trae", "gemini", "windsurf", "cline", "continue",
    "amazon-q", "coding-assistant", "developer-tools",
    "automation", "workflow", "cli", "python", "open-source"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest", "build"]

[project.urls]
Homepage = "https://github.com/weed33834/agentseed"
Repository = "https://github.com/weed33834/agentseed"

[project.scripts]
agentseed = "agentseed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentseed*"]

# 规则源文件随包分发：setup.py 的 build_py/sdist 子类会在构建前把
# 仓库根的 core/ personas/ capabilities/ personas/ adapters/ mcp.example.json
# 同步到 agentseed/_resources/，下面声明让 setuptools 把它们打进 wheel。
[tool.setuptools.package-data]
agentseed = [
    "_resources/**/*",
    "_resources/*",
]

# 注：dev 模式（pip install -e .）下 _resources/ 不存在，
# sync_rules._packaged_resources_root() 返回 None，自动回退到 dev 模式
# （agentseed/sync_rules.py 的 parent.parent = REPO_ROOT，那里有 personas/）。
